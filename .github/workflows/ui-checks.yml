name: UI and admissions checks

on:
  pull_request:
    paths:
      - 'admissions/**'
      - 'support/**'
      - 'templates/**'
      - 'static/**'
      - 'tests/frontend/**'
      - '.github/workflows/ui-checks.yml'
  workflow_dispatch:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kunirank
          POSTGRES_USER: kunirank
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kunirank -d kunirank"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: kunirank
      DB_USER: kunirank
      DB_PASSWORD: test-password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DJANGO_SECRET_KEY: ci-not-production-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      DJANGO_DEBUG: 'false'
      SUPPORT_ACCEPTING_TRANSFERS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test admissions.test_discovery admissions.test_grade_cut_quality support.tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
