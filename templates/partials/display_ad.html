<!-- Google AdSense manual display ad -->
<div class="manual-display-ad" style="margin: 28px 0; width: 100%;">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-3862816878614020"
         data-ad-slot="8829169633"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
</div>
{% if request.resolver_match.namespace == 'admissions' and request.resolver_match.url_name == 'university' %}
<script>
(function () {
    var script = document.currentScript;
    var ad = script ? script.previousElementSibling : null;
    var controls = document.querySelector('.admission-control-card');

    if (controls) controls.style.display = 'none';

    document.addEventListener('DOMContentLoaded', function () {
        var results = document.getElementById('admission-unit-results');
        var search = results ? results.querySelector('.detail-results-search') : null;

        if (controls) {
            var trackLabels = ['학생부교과', '학생부종합', '수능', '논술', '실기'];
            var hasTrackFilters = Array.prototype.some.call(
                controls.querySelectorAll('a'),
                function (link) {
                    return trackLabels.indexOf((link.textContent || '').trim()) !== -1;
                }
            );

            if (!hasTrackFilters) {
                var trackRow = document.createElement('div');
                trackRow.className = 'region-chips admission-track-tabs';
                trackRow.setAttribute('aria-label', '전형 유형');
                trackRow.style.margin = '0';
                trackRow.style.paddingBottom = '0';

                var tracks = [
                    ['', '전체'],
                    ['student', '학생부교과'],
                    ['holistic', '학생부종합'],
                    ['csat', '수능'],
                    ['essay', '논술'],
                    ['practical', '실기']
                ];
                var currentTrack = new URL(window.location.href).searchParams.get('track') || '';

                tracks.forEach(function (item) {
                    var key = item[0];
                    var label = item[1];
                    var url = new URL(window.location.href);
                    url.searchParams.delete('page');

                    if (key) {
                        url.searchParams.set('track', key);
                        if (key === 'student' || key === 'holistic' || key === 'essay') {
                            url.searchParams.set('phase', 'SUSI');
                        } else if (key === 'csat') {
                            url.searchParams.set('phase', 'JEONGSI');
                        }
                    } else {
                        url.searchParams.delete('track');
                    }
                    url.hash = 'admission-unit-results';

                    var link = document.createElement('a');
                    link.className = 'region-chip' + (currentTrack === key ? ' active' : '');
                    link.href = url.pathname + (url.search ? url.search : '') + url.hash;
                    link.textContent = label;
                    trackRow.appendChild(link);
                });

                controls.appendChild(trackRow);
            }

            if (results) {
                if (search) {
                    results.insertBefore(controls, search);
                } else {
                    results.appendChild(controls);
                }
            }
            controls.style.display = '';
        }

        var summary = document.querySelector('.core-admission-summary');
        if (ad) {
            if (summary) {
                summary.insertAdjacentElement('afterend', ad);
            } else if (results) {
                results.insertAdjacentElement('beforebegin', ad);
            }
        }

        try {
            (adsbygoogle = window.adsbygoogle || []).push({});
        } catch (error) {
            // AdSense may be blocked by the browser; layout should still work normally.
        }
    });
})();
</script>
{% elif request.resolver_match.url_name == 'home' %}
<script>
(function () {
    function requestAd() {
        try {
            (adsbygoogle = window.adsbygoogle || []).push({});
        } catch (error) {
            // AdSense may be blocked by the browser; layout should still work normally.
        }
    }

    // Hero 아래의 기존 광고를 먼저 요청한다.
    requestAd();

    document.addEventListener('DOMContentLoaded', function () {
        var representative = document.querySelector('.representative-section');
        var explorer = document.getElementById('admission-explorer');

        if (!representative || !explorer || document.querySelector('.home-secondary-display-ad')) {
            return;
        }

        var wrapper = document.createElement('div');
        wrapper.className = 'manual-display-ad home-secondary-display-ad';
        wrapper.style.margin = '28px 0';
        wrapper.style.width = '100%';

        var ad = document.createElement('ins');
        ad.className = 'adsbygoogle';
        ad.style.display = 'block';
        ad.setAttribute('data-ad-client', 'ca-pub-3862816878614020');
        ad.setAttribute('data-ad-slot', '8829169633');
        ad.setAttribute('data-ad-format', 'auto');
        ad.setAttribute('data-full-width-responsive', 'true');

        wrapper.appendChild(ad);
        representative.insertAdjacentElement('afterend', wrapper);
        requestAd();
    });
})();
</script>
{% else %}
<script>
(function () {
    function requestAd() {
        try {
            (adsbygoogle = window.adsbygoogle || []).push({});
        } catch (error) {
            // AdSense may be blocked by the browser; layout should still work normally.
        }
    }

    // 페이지 상단의 기존 광고를 먼저 요청한다.
    requestAd();

    document.addEventListener('DOMContentLoaded', function () {
        var list = document.querySelector('.admission-ranking-list');
        var rows = list ? list.querySelectorAll('.admission-ranking-row') : [];

        // 짧은 순위에는 추가 광고를 넣지 않는다.
        if (!list || rows.length < 12 || document.querySelector('.ranking-secondary-display-ad')) {
            return;
        }

        var section = list.closest('.admission-ranking-section');
        var pager = section ? section.querySelector('.admission-ranking-pager') : null;
        var disclaimer = section ? section.querySelector('.admission-ranking-disclaimer') : null;

        var wrapper = document.createElement('div');
        wrapper.className = 'manual-display-ad ranking-secondary-display-ad';
        wrapper.style.margin = '28px 0 18px';
        wrapper.style.width = '100%';

        var ad = document.createElement('ins');
        ad.className = 'adsbygoogle';
        ad.style.display = 'block';
        ad.setAttribute('data-ad-client', 'ca-pub-3862816878614020');
        ad.setAttribute('data-ad-slot', '8829169633');
        ad.setAttribute('data-ad-format', 'auto');
        ad.setAttribute('data-full-width-responsive', 'true');

        wrapper.appendChild(ad);

        // 순위 행 사이를 끊지 않고, 목록과 페이지네이션이 끝난 뒤 독립 영역으로 배치한다.
        if (pager) {
            pager.insertAdjacentElement('afterend', wrapper);
        } else if (disclaimer) {
            disclaimer.insertAdjacentElement('beforebegin', wrapper);
        } else {
            list.insertAdjacentElement('afterend', wrapper);
        }

        requestAd();
    });
})();
</script>
{% endif %}
