{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="results-pager kuni-pagination{% if pager_class %} {{ pager_class }}{% endif %}"
     aria-label="{{ pagination_label|default:'페이지 이동' }}">
    <div class="pagination-side">
        {% if page_obj.has_previous %}
            <a class="page-button{% if pager_link_class %} {{ pager_link_class }}{% endif %}"
               href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page=1{% if pagination_anchor %}#{{ pagination_anchor }}{% endif %}">처음</a>
            <a class="page-button{% if pager_link_class %} {{ pager_link_class }}{% endif %}"
               href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}{% if pagination_anchor %}#{{ pagination_anchor }}{% endif %}">이전</a>
        {% else %}
            <span class="page-button disabled" aria-disabled="true">처음</span>
            <span class="page-button disabled" aria-disabled="true">이전</span>
        {% endif %}
    </div>

    <div class="pagination-center" aria-live="polite">
        <strong>{{ page_obj.number }}</strong>
        <span data-total="{{ page_obj.paginator.num_pages }}">/ {{ page_obj.paginator.num_pages }} 페이지</span>
    </div>

    <div class="pagination-side">
        {% if page_obj.has_next %}
            <a class="page-button{% if pager_link_class %} {{ pager_link_class }}{% endif %}"
               href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}{% if pagination_anchor %}#{{ pagination_anchor }}{% endif %}">다음</a>
            <a class="page-button{% if pager_link_class %} {{ pager_link_class }}{% endif %}"
               href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.paginator.num_pages }}{% if pagination_anchor %}#{{ pagination_anchor }}{% endif %}">마지막</a>
        {% else %}
            <span class="page-button disabled" aria-disabled="true">다음</span>
            <span class="page-button disabled" aria-disabled="true">마지막</span>
        {% endif %}
    </div>
</nav>
{% endif %}
